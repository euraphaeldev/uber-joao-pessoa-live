<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Uber João Pessoa | Live Overlay V2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
body{font-family:Arial,Helvetica,sans-serif}
svg{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block;overflow:hidden;pointer-events:none;background:transparent;transform-origin:top left}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 1.5s steps(1) infinite}
.sweep{animation:sweep 5s linear infinite}
@keyframes pulse{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes blink{0%,55%{opacity:1}56%,75%{opacity:.15}76%,100%{opacity:1}}
@keyframes sweep{0%{transform:translateX(-250px)}100%{transform:translateX(2300px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-label="Overlay transparente Uber João Pessoa, duas câmeras 16 por 9">

<filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>

</svg><script>
(function(){
 const svg=document.querySelector('svg');
 function resize(){
   const w=document.documentElement.clientWidth||innerWidth;
   const h=document.documentElement.clientHeight||innerHeight;
   svg.style.transform='scale('+(w/1920)+','+(h/1080)+')';
 }
 addEventListener('resize',resize);
 resize();
})();
</script></body></html>
